[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/server",
    # src-tauri joins once M4 starts (native shell)
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/amatemeow/photodedup"

[workspace.dependencies]
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# default-features off: the `image` crate's defaults pull in the AVIF
# *encoder* (ravif/rav1e), which we never use (HEIC/video decode go through
# the bundled ffmpeg sidecar per /SPIKES.md; AVIF *decode* is a roadmap item
# via `rav1d`, a clean BSD-2 dependency, not ravif/rav1e) -- and rav1e
# transitively pulls in `libfuzzer-sys`, NCSA-licensed, caught by
# `cargo deny check licenses`. Enable only the codecs actually in use.
# pnm (PPM) decode: used as the pipe format from the ffmpeg sidecar instead
# of PNG -- PNG's DEFLATE compression costs ~1.1s/file round-trip (ffmpeg
# encode + Rust decode) on a 12MP HEIC source; uncompressed PPM costs ~0.1s
# for the same frame, a >10x win, since this is a local pipe where the
# extra bytes are free and compression CPU is not. Confirmed `pnm` pulls in
# no new transitive deps (independent of the `avif` feature deliberately
# left off -- see the note below).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
blake3 = "1"
# SHA-256 for the AI model manifest (core::ai_models): the hash the model hosts publish, so we can compare with it.
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
# Image EXIF (JPEG + HEIC, one code path, pure Rust) -- see SPIKES.md §4.
# Video metadata goes through ffprobe instead; nom-exif's TrackInfo path
# has no mapping for Android vendor atoms (com.oplus.product.model).
nom-exif = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
walkdir = "2"
# POSIX setpriority() for background-friendly scanning (see
# core::throttle) -- ubiquitous, tiny, MIT/Apache-2.0.
libc = "0.2"

# --- M2: crates/server (loopback HTTP + SSE review UI backend) ---
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
# Session token generation only -- not used for anything cryptographic
# beyond "hard to guess", so getrandom-backed OsRng via `rand` is plenty.
rand = "0.8"
# Opaque scan ids (see core::store): random v4, never reused.
uuid = { version = "1", features = ["v4"] }
