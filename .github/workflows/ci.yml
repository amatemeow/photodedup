# SPDX-License-Identifier: Apache-2.0
# Every third-party action is pinned to a full commit SHA (the tag is in the
# comment), so a moved or hijacked tag can't change what runs here.
# Checks on every push and pull request, and on demand from the Actions tab (Run
# workflow), which ignores [skip ci]. NOTE: written to match the commands
# that were run locally, but this workflow itself has not been run on GitHub yet
# (see docs/FIRST-CI-RUN.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine and UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch, as of 2026-10-28
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI checks and build
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Engine and server tests
        run: cargo test --workspace
      - name: Server tests with the UI compiled in
        run: cargo test -p photodedup-server --features embed-ui

  # The engine and server tests on the other systems, to learn early whether the
  # engine itself builds and passes there. Windows is informational
  # (`continue-on-error`) until it has run clean once; macOS is held to the same
  # standard as Linux. Neither needs the UI.
  engine-os:
    name: engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch, as of 2026-10-28
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Engine and server tests
        run: cargo test --workspace

  licences:
    name: licences, advisories, reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: cargo-deny (engine workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./Cargo.toml
      - name: cargo-deny (desktop shell)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./src-tauri/Cargo.toml
          arguments: --config ./deny.toml
      - name: REUSE compliance
        uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5.0.0

  shell:
    name: desktop shell compiles
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch, as of 2026-10-28
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build the UI (it is compiled into the app)
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Compile the shell
        working-directory: src-tauri
        run: cargo build
