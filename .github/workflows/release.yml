# SPDX-License-Identifier: Apache-2.0
# Builds the installers when a version tag is pushed (`git tag v0.1.0 && git
# push --tags`) and attaches them to a GitHub release with checksums and build
# attestations.
#
# Hardening, because this workflow handles release artifacts:
#  * every third-party action is pinned to a full commit SHA (the tag is in the
#    comment), so a moved or hijacked tag can't change what runs;
#  * the build job compiles code from many dependencies (build scripts run
#    arbitrary code), so it gets NO write access to the repository and uses no
#    build cache that a poisoned entry could ride in on;
#  * only the small publish job can write to the release, and all it does is
#    upload files the build job already produced and attested.
#
# NOTE: first dry run 2026-10-29 (see docs/FIRST-CI-RUN.md): the Apple Silicon leg
# built everything, then failed on the attestation step (private repository).
# Before the first tag, run it by hand again (Actions tab, "Run workflow"). What
# was verified locally is the
# pieces it strings together, on macOS/arm64 only: building the LGPL ffmpeg
# (scripts/build-sidecar.sh), the licence gate on it, and `tauri build`. The
# Windows and Linux legs, and the x86-64 macOS leg, are untested.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run from the Actions tab: builds every installer and keeps them as
  # workflow artifacts, but publishes nothing (the publish job needs a tag).
  # Private-repository minutes are billed per platform (macOS x10, Windows x2),
  # so a dry run builds ONE leg unless told otherwise; a tag always builds all.
  workflow_dispatch:
    inputs:
      legs:
        description: "Which installer to build (macos-intel is the most expensive)"
        type: choice
        default: linux
        options: [linux, windows, macos-arm, macos-intel, all]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # Chooses the build matrix: every leg for a tag, the chosen one for a dry run.
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          LEGS: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'all' }}
        run: |
          # Labels checked against GitHub's runner docs on 2026-10-29: macos-14
          # is retired on 2026-11-02 and macos-13 no longer exists.
          all='[
            {"leg":"macos-arm",   "os":"macos-15",       "bundles":"dmg"},
            {"leg":"macos-intel", "os":"macos-15-intel", "bundles":"dmg"},
            {"leg":"windows",     "os":"windows-latest", "bundles":"msi"},
            {"leg":"linux",       "os":"ubuntu-22.04",   "bundles":"appimage,deb,rpm"}
          ]'
          if [ "$LEGS" = all ]; then sel="$(jq -c . <<<"$all")"; else sel="$(jq -c --arg l "$LEGS" 'map(select(.leg == $l))' <<<"$all")"; fi
          [ "$(jq length <<<"$sel")" -gt 0 ] || { echo "::error::no such leg: $LEGS"; exit 1; }
          echo "matrix={\"include\":$sel}" >> "$GITHUB_OUTPUT"
          echo "building: $(jq -r 'map(.leg) | join(", ")' <<<"$sel")"

  build:
    needs: plan
    permissions:
      contents: read
      id-token: write       # build attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch, as of 2026-10-28
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf nasm

      # ffmpeg's x86 build needs an assembler. (Apple Silicon does not.)
      - name: nasm for the Intel Mac build
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: brew install nasm

      # ffmpeg must be an LGPL build we made ourselves; the script refuses to
      # produce anything the licence gate rejects.
      - name: Build the ffmpeg sidecar (LGPL)
        if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh

      # Windows builds ffmpeg with the MSYS2 mingw-w64 toolchain, as the script
      # documents. The licence gate then runs outside MSYS2 (see the script).
      - name: MSYS2 toolchain for the ffmpeg build
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          path-type: inherit     # keep rustc/cargo on the PATH
          update: false
          install: >-
            base-devel
            diffutils
            make
            curl
            xz
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
      - name: Build the ffmpeg sidecar (LGPL, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          SKIP_GATE: "1"
        run: ./scripts/build-sidecar.sh
      - name: Licence gate and imports for the Windows sidecar
        if: runner.os == 'Windows'
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          cargo run -q -p photodedup-cli -- check-sidecar "sidecar/photodedup-ffmpeg-${TRIPLE}.exe" "sidecar/photodedup-ffprobe-${TRIPLE}.exe"
          # The DLLs the sidecar needs must all be Windows' own. MinGW's runtime
          # DLLs are named lib*.dll (libwinpthread-1, libgcc_s_seh-1, libstdc++-6)
          # and do not exist on a user's machine, so the sidecar would not start.
          command -v objdump >/dev/null || { echo "::error::objdump is not available to check the sidecar's DLLs"; exit 1; }
          bad=0
          for f in sidecar/*.exe; do
            echo "DLLs imported by $f:"
            dlls="$(objdump -p "$f" | grep "DLL Name" || true)"
            echo "$dlls"
            if echo "$dlls" | grep -qi "DLL Name: lib"; then
              echo "::error file=$f::imports a MinGW runtime DLL that Windows does not have"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: Check the macOS sidecar links only system libraries
        if: runner.os == 'macOS'
        run: |
          for f in sidecar/photodedup-ffmpeg-* sidecar/photodedup-ffprobe-*; do
            echo "$f"; otool -L "$f" | tail -n +2
            if otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -v -E '^/usr/lib/|^/System/'; then
              echo "::error file=$f::links a library that is not part of macOS"; exit 1
            fi
          done

      - name: Show the Linux sidecar's shared libraries
        if: runner.os == 'Linux'
        run: for f in sidecar/photodedup-ffmpeg-* sidecar/photodedup-ffprobe-*; do echo "$f"; ldd "$f"; done

      - name: Install cargo-about
        if: ${{ !(runner.os == 'macOS' && runner.arch == 'X64') }}
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-about@0.9.3
      # There is no prebuilt cargo-about for Intel macOS. The action then builds
      # it from source WITHOUT the `cli` feature and reports success while
      # installing nothing (first dry run: "no such command: `about`"). Build it
      # ourselves, with the feature.
      - name: Install cargo-about (Intel macOS, built with its cli feature)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Check cargo-about is really installed
        run: cargo about --version

      - name: Generate the third-party licence file that ships in the app
        run: |
          (cd ui && npm ci)
          ./scripts/third-party-licenses.sh

      - name: Build the installer
        working-directory: src-tauri
        env:
          # "-" = ad-hoc signature: required to run on Apple Silicon, but it
          # does not remove the first-launch warning (see docs/INSTALL.md).
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }} --config tauri.release.conf.json

      - name: Collect installers and checksums
        run: |
          mkdir dist
          find src-tauri/target/release/bundle -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} dist/ \;
          cd dist
          ls
          { sha256sum -- * 2>/dev/null || shasum -a 256 -- *; } > "../SHA256SUMS-${{ matrix.os }}.txt"
          mv "../SHA256SUMS-${{ matrix.os }}.txt" .

      # Build attestations are only available for public repositories (or paid
      # organisation plans): on a user-owned private repository the step fails
      # with "Feature not available for user-owned private repositories", which
      # also used to cost the finished installers (the upload came after it).
      # Skipped while the repository is private; it runs once it is public.
      - name: Attest the build provenance (public repositories only)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

      # Linux packages: the sidecars are installed into /usr/bin, so they must
      # not be called plain ffmpeg/ffprobe (that would collide with the
      # distribution's own ffmpeg package). Print what each package contains.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          deb=(dist/*.deb); rpmf=(dist/*.rpm)
          [ -f "${deb[0]}" ] && [ -f "${rpmf[0]}" ] || { echo "::error::the .deb or the .rpm is missing"; exit 1; }
          # Printouts only (never fail the step): the checks are the loop below.
          dpkg-deb -I "${deb[0]}" | grep -E 'Package|Version|Depends' || true
          dpkg-deb -c "${deb[0]}" | grep 'usr/bin/' || true
          rpm -qp --requires "${rpmf[0]}" || true
          rpm -qpl "${rpmf[0]}" | grep '^/usr/bin/' || true
          for list in "$(dpkg-deb --fsys-tarfile "${deb[0]}" | tar -t)" "$(rpm -qpl "${rpmf[0]}")"; do
            if echo "$list" | grep -E '(^|/)usr/bin/(ffmpeg|ffprobe)$'; then
              echo "::error::a package installs a bare /usr/bin/ffmpeg or ffprobe"; exit 1
            fi
            echo "$list" | grep -q 'usr/bin/photodedup-ffmpeg$' || { echo "::error::photodedup-ffmpeg is not in a package"; exit 1; }
          done

      # archive: false uploads each file as it is (no zip around it), so an
      # installer can be downloaded and opened directly. It takes one file per
      # upload and names the artifact after the file; each step errors if its
      # file is missing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          path: dist/*.msi
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          path: dist/*.AppImage
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          path: dist/*.deb
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          path: dist/*.rpm
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHA256SUMS-${{ matrix.os }}.txt
          archive: false
          if-no-files-found: error

  publish:
    needs: build
    # Only a pushed version tag publishes; a manual dry run stops at the artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write         # the only job that can touch the release
    steps:
      # Every artifact of this run is an installer or a checksum file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
