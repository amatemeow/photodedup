# SPDX-License-Identifier: Apache-2.0
# Rebuilds the AI model files from the upstream weights and proves they are the ones models/manifest.json records:
# downloads Google's SigLIP 2 weights at the pinned commit (1.5 GB, fresh every run: nothing here is cached), refuses
# any file whose SHA-256 differs, builds the ONNX files with the hash-locked tools, and runs `photodedup check-models`
# on the result. A cheap pass (the manifest and its lock files) already runs in ci.yml via `cargo test`.
#
# Runs when anything that can change a model changes, and on demand from the Actions tab (Run workflow).
# The build is meant to be byte-identical on every machine; this is the run that proves it on the CI runner
# (it was identical on macOS arm64 and on Ubuntu 24.04 arm64 and x86-64 in containers, the last one emulated).
# NOTE: written to match the commands that were run locally and in containers; this workflow has not run on
# GitHub yet. Third-party actions are pinned to full commit SHAs, as in ci.yml.
name: models

on:
  push:
    branches: [main]
    paths:
      - models/**
      - scripts/export-siglip2.py
      - scripts/siglip2/**
      - crates/core/src/ai_models.rs
      - crates/cli/src/main.rs
      - .github/workflows/models.yml
  pull_request:
    paths:
      - models/**
      - scripts/export-siglip2.py
      - scripts/siglip2/**
      - crates/core/src/ai_models.rs
      - crates/cli/src/main.rs
      - .github/workflows/models.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    name: rebuild and verify the model files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the `stable` branch, as of 2026-10-28
        with:
          toolchain: stable
      - name: The manifest passes the gate
        run: cargo run -q -p photodedup-cli -- check-models
      # The tool lists are hash-locked: pip refuses any file whose hash is not in the list, wherever it comes from.
      # PyTorch's own CPU index is added so the CPU-only torch wheel is found (the default one pulls GPU libraries).
      - name: Install the locked build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r scripts/siglip2/requirements-linux.txt
      - name: Download the pinned weights and build the ONNX files
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/export-siglip2.py "$RUNNER_TEMP/siglip2-src" "$RUNNER_TEMP/siglip2-out"
      - name: The built files match the manifest
        run: cargo run -q -p photodedup-cli -- check-models --built "$RUNNER_TEMP/siglip2-out"
      - name: Print the hashes
        run: sha256sum "$RUNNER_TEMP"/siglip2-out/*.onnx
      # The file that ships, so anyone can compare their own build with the CI one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/siglip2-out/siglip2-vision-fp16.onnx
          archive: false
          if-no-files-found: error
          retention-days: 14
