# cargo-deny config — license hygiene gate (see ROADMAP.md / plan "Licensing
# & open-source posture"). Run with: cargo deny check licenses

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    # More permissive than plain Apache-2.0 (it adds an exception for LLVM's
    # runtime-library use); pulled in by the desktop shell's dependency tree.
    "Apache-2.0 WITH LLVM-exception",
]
# GPL-*/AGPL-* are implicitly denied by not being in `allow`.
# LGPL-* is deliberately left out of `allow` too: the one accepted exception
# (ffmpeg) is invoked as a subprocess, not a Cargo dependency, so it never
# appears here. If an LGPL crate ever shows up in this list it means
# something is being *linked*, not shelled out to — that must be a
# conscious decision (see the plan's HEIC spike note on libheif-rs), not a
# transitive surprise. Handle it by adding an explicit, commented exception
# here, not by widening `allow` blindly.
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Reviewed exceptions, each with the reason. Nothing is ignored by default.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is flagged unmaintained (not vulnerable). It is a compile-time macro crate reached only through the Linux GTK bindings (gtk-rs 0.18, via Tauri's windowing layer); it is not part of the shipped program and not used on macOS or Windows. Revisit when Tauri moves to newer GTK bindings." },
]

