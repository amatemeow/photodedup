[package]
name = "photodedup-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Compile the built web UI (`ui/dist`) into the binary. Needs `npm run build`
# first; the Tauri shell turns it on, a plain `cargo build` does not.
embed-ui = ["dep:rust-embed"]

[dependencies]
photodedup-core = { path = "../core" }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[dev-dependencies]
tempfile = "3"
image = { workspace = true }
