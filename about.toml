# Settings for `cargo about`, which writes THIRD-PARTY-LICENSES.md: the notices
# we are obliged to reproduce for the open-source code we ship. The accepted
# list mirrors deny.toml (that is the gate; this is the paperwork).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
]
# Only what is compiled into the shipped program.
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
